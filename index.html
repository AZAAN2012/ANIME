<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANIMES WATCHED | Cyberpunk Electric</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
    --bg: #030611;
    --panel: rgba(10, 19, 39, 0.82);
    --panel-light: rgba(17, 30, 57, 0.8);
    --cyan: #00f5ff;
    --blue: #388bff;
    --purple: #a855f7;
    --pink: #ff35c6;
    --green: #55ffb1;
    --text: #f1f7ff;
    --muted: #93a7c7;
    --border: rgba(0, 245, 255, 0.2);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    color: var(--text);
    background:
        linear-gradient(rgba(3, 6, 17, .76), rgba(3, 6, 17, .88)),
        url("./gojo-background.png") center center / cover fixed no-repeat,
        radial-gradient(ellipse at 10% 5%, rgba(0, 245, 255, .10), transparent 35%),
        radial-gradient(ellipse at 90% 25%, rgba(168, 85, 247, .13), transparent 35%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 53, 198, .07), transparent 35%),
        var(--bg);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(0,245,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: .10;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.25) 4px
    );
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1180px, 92%);
    margin: auto;
}

/* ORIGINAL WORK POPUP */

.custom-alert-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 3, 12, .92);
    backdrop-filter: blur(14px);
    transition: opacity .4s ease, visibility .4s ease;
}

.custom-alert-overlay.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.custom-alert-box {
    width: min(420px, 100%);
    padding: 36px 28px;
    text-align: center;
    background: linear-gradient(145deg, #101d38, #080d1d);
    border: 1px solid var(--cyan);
    clip-path: polygon(
        0 18px, 18px 0, calc(100% - 18px) 0,
        100% 18px, 100% calc(100% - 18px),
        calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px)
    );
    box-shadow: 0 0 35px rgba(0,245,255,.18);
    animation: popupIn .45s ease;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.popup-tag {
    color: var(--pink);
    font-family: 'Orbitron', sans-serif;
    font-size: .7rem;
    letter-spacing: 4px;
    margin-bottom: 17px;
}

.custom-alert-box h2 {
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    margin-bottom: 13px;
    text-shadow: 0 0 15px rgba(0,245,255,.4);
}

.custom-alert-box p {
    color: var(--muted);
    letter-spacing: 2px;
    font-size: 1rem;
    margin-bottom: 26px;
}

.popup-button {
    width: 100%;
    padding: 13px;
    color: #001018;
    border: none;
    background: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    letter-spacing: 2px;
    transition: .25s;
}

.popup-button:hover {
    background: white;
    box-shadow: 0 0 25px var(--cyan);
    transform: translateY(-2px);
}

.popup-button small {
    display: block;
    margin-top: 5px;
    color: #7b164f;
    font-size: .67rem;
    letter-spacing: 3px;
}

/* HERO */

.hero {
    position: relative;
    padding: 85px 0 50px;
    text-align: center;
}

.hero::before,
.hero::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 1px;
    top: 125px;
    background: linear-gradient(90deg, transparent, var(--cyan));
}

.hero::before {
    left: max(3%, calc((100% - 1050px) / 2));
}

.hero::after {
    right: max(3%, calc((100% - 1050px) / 2));
    transform: rotate(180deg);
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    background: rgba(0,245,255,.045);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: .66rem;
    letter-spacing: 2px;
}

.status-dot {
    width: 7px;
    height: 7px;
    display: inline-block;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--green);
    animation: blink 1.7s infinite;
}

@keyframes blink {
    50% {
        opacity: .35;
    }
}

.hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.3rem, 7vw, 5.5rem);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -2px;
    color: #fff;
    text-shadow:
        0 0 8px rgba(0,245,255,.6),
        0 0 35px rgba(0,245,255,.2);
    animation: titleGlow 4s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow: 0 0 8px rgba(0,245,255,.45), 0 0 25px rgba(0,245,255,.12);
    }
    to {
        text-shadow: 0 0 13px rgba(0,245,255,.7), 0 0 42px rgba(168,85,247,.35);
    }
}

.hero h1 span {
    color: var(--cyan);
}

.hero-subtitle {
    max-width: 620px;
    margin: 20px auto 0;
    color: var(--muted);
    font-size: 1.2rem;
    letter-spacing: .6px;
    line-height: 1.6;
}

.hero-line {
    width: 90px;
    height: 3px;
    margin: 30px auto 0;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
    box-shadow: 0 0 15px rgba(0,245,255,.35);
}

/* SECTION HEADINGS */

.section {
    margin-bottom: 65px;
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 25px;
    padding-bottom: 17px;
    border-bottom: 1px solid rgba(0,245,255,.15);
}

.section-heading h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.15rem, 3vw, 1.65rem);
    letter-spacing: 1px;
}

.section-heading h2 span {
    color: var(--cyan);
}

.section-code {
    color: var(--muted);
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem;
    letter-spacing: 2px;
}

/* WATCHED LIST */

.watched-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.watched-item {
    position: relative;
    min-height: 100px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.09);
    transition: .25s ease;
    overflow: hidden;
}

.watched-item:hover {
    border-color: var(--cyan);
    transform: translateY(-4px);
    background: var(--panel-light);
}

.watched-index {
    font-family: 'Orbitron', sans-serif;
    color: var(--cyan);
    font-size: 1.15rem;
    font-weight: 800;
}

.watched-name {
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: .6px;
}

.watched-status {
    display: inline-block;
    margin-top: 5px;
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: 1px;
}

/* ANIME CARDS */

.anime-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.anime-card {
    --accent: var(--cyan);
    position: relative;
    isolation: isolate;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.10);
    overflow: hidden;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}

/* Rotating electric light around the card edges on hover */
.anime-card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    background: conic-gradient(from var(--edge-angle, 0deg), transparent 0deg, var(--accent) 55deg, #fff 90deg, var(--accent) 130deg, transparent 190deg, transparent 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity .25s ease;
}

.anime-card:hover::before {
    opacity: 1;
    animation: electricEdgeSpin 2.2s linear infinite;
}

.anime-card:hover {
    transform: translateY(-7px);
    border-color: var(--accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 50%, transparent),
                0 0 28px color-mix(in srgb, var(--accent) 28%, transparent),
                0 12px 35px rgba(0,0,0,.25);
}

@property --edge-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
}

@keyframes electricEdgeSpin {
    from { --edge-angle: 0deg; }
    to { --edge-angle: 360deg; }
}

.anime-card.eren {
    --accent: var(--cyan);
}

.anime-card.jinwoo {
    --accent: var(--purple);
}

.anime-card.sukuna {
    --accent: var(--pink);
}

.card-topline {
    height: 3px;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
}

.anime-image-wrap {
    position: relative;
    height: 280px;
    overflow: hidden;
    background: #080d1c;
}

.anime-image-wrap::after {
    content: "";
    position: absolute;
    inset: 35% 0 0;
    background: linear-gradient(transparent, rgba(3,6,17,.96));
    pointer-events: none;
}

.anime-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    transition: transform .6s ease;
}

.anime-card:hover .anime-image {
    transform: scale(1.055);
}

.card-number {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 2;
    padding: 7px 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    background: rgba(3,6,17,.82);
    font-family: 'Orbitron', sans-serif;
    font-size: .68rem;
    letter-spacing: 1px;
}

.card-rating {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    padding: 7px 10px;
    color: #fff;
    background: rgba(3,6,17,.82);
    border: 1px solid rgba(255,255,255,.15);
    font-family: 'Orbitron', sans-serif;
    font-size: .7rem;
}

.card-body {
    position: relative;
    padding: 22px;
}

.card-category {
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.card-body h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.18rem;
    line-height: 1.4;
    margin-bottom: 7px;
}

.card-character {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 17px;
}

.card-description {
    color: #b7c7e1;
    font-size: .98rem;
    line-height: 1.65;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 17px;
    margin-top: 19px;
    border-top: 1px solid rgba(255,255,255,.09);
}

.card-footer span {
    color: var(--muted);
    font-size: .78rem;
    letter-spacing: 1px;
}

.card-footer strong {
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: .75rem;
}

/* AUDIO SECTION */

.audio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.audio-card {
    --audio-accent: var(--cyan);
    position: relative;
    padding: 22px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.1);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}

.audio-card:hover {
    transform: translateY(-5px);
    border-color: var(--audio-accent);
    box-shadow: 0 0 25px rgba(0,245,255,.08);
}

.eren-audio {
    --audio-accent: var(--cyan);
}

.jinwoo-audio {
    --audio-accent: var(--purple);
}

.sukuna-audio {
    --audio-accent: var(--pink);
}

.audio-header {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 20px;
}

.audio-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: var(--audio-accent);
    border: 1px solid var(--audio-accent);
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    box-shadow: inset 0 0 12px rgba(0,245,255,.05);
}

.audio-title {
    font-family: 'Orbitron', sans-serif;
    font-size: .88rem;
    font-weight: 700;
    letter-spacing: .5px;
}

.audio-subtitle {
    color: var(--muted);
    font-size: .9rem;
    margin-top: 5px;
}

.audio-visualizer {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin: 10px 0 22px;
    overflow: hidden;
}

.audio-visualizer span {
    display: block;
    width: 4px;
    height: 12%;
    min-height: 5px;
    border-radius: 4px;
    background: var(--audio-accent);
    opacity: .8;
    transform-origin: center;
    box-shadow: 0 0 8px color-mix(in srgb, var(--audio-accent) 45%, transparent);
}

.audio-card.is-playing .audio-visualizer span {
    animation: soundBars .7s ease-in-out infinite alternate;
}

.audio-visualizer span:nth-child(4n + 1) { animation-delay: -.1s; }
.audio-visualizer span:nth-child(4n + 2) { animation-delay: -.4s; }
.audio-visualizer span:nth-child(4n + 3) { animation-delay: -.25s; }
.audio-visualizer span:nth-child(5n) { animation-delay: -.55s; }

@keyframes soundBars {
    from { height: 12%; opacity: .45; }
    to { height: 95%; opacity: 1; }
}

.audio-controls {
    display: flex;
    align-items: center;
    gap: 14px;
}

.play-button {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    color: #06101a;
    background: var(--audio-accent);
    border: none;
    font-size: 1rem;
    font-weight: 900;
    transition: .25s;
}

.play-button:hover {
    background: white;
    box-shadow: 0 0 18px var(--audio-accent);
    transform: scale(1.05);
}

.audio-timeline {
    min-width: 0;
    flex: 1;
}

.seek-bar,
.volume-bar {
    width: 100%;
    accent-color: var(--audio-accent);
    cursor: pointer;
}

.seek-bar {
    display: block;
    height: 4px;
}

.time-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    color: var(--muted);
    font-family: 'Orbitron', sans-serif;
    font-size: .62rem;
}

.audio-volume {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 19px;
}

.volume-label {
    color: var(--muted);
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem;
    letter-spacing: 1px;
}

.audio-status {
    margin-top: 17px;
    color: var(--audio-accent);
    font-family: 'Orbitron', sans-serif;
    font-size: .61rem;
    letter-spacing: 1px;
}

.audio-status.error {
    color: #ff648f;
}

/* FOOTER */

.footer {
    padding: 35px 0 45px;
    border-top: 1px solid rgba(0,245,255,.15);
    text-align: center;
    background: rgba(3,6,17,.45);
}

.footer-title {
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: .8rem;
    letter-spacing: 2px;
}

.footer p {
    color: var(--muted);
    margin-top: 10px;
    font-size: .95rem;
}

.footer-line {
    width: 65px;
    height: 2px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .watched-list,
    .anime-grid,
    .audio-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .hero::before,
    .hero::after {
        width: 60px;
    }
}

@media (max-width: 620px) {
    .hero {
        padding: 65px 0 42px;
    }

    .hero::before,
    .hero::after {
        display: none;
    }

    .watched-list,
    .anime-grid,
    .audio-grid {
        grid-template-columns: 1fr;
    }

    .section {
        margin-bottom: 48px;
    }

    .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
    }

    .anime-image-wrap {
        height: 300px;
    }

    .audio-card {
        padding: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>
